worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  aio threads;
  tcp_nopush on;
  keepalive_timeout 30;
  keepalive_requests 1000;

  upstream library_file_app {
    server library-file-service:3011;
    keepalive 16;
  }

  server {
    listen 3012;
    server_name _;

    location /_protected-storage/ {
      internal;
      alias /data/storage/;
      add_header Access-Control-Allow-Origin "https://www.jasonsome.cn" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Disposition, ETag, Last-Modified, X-Request-Id, X-Library-File-Source, X-Download-Accelerator" always;
      add_header Vary "Origin" always;
      add_header Accept-Ranges bytes always;
      add_header X-Download-Accelerator nginx-sendfile always;
    }

    location /_protected-page-images/ {
      internal;
      alias /data/page_images/;
      add_header Access-Control-Allow-Origin "https://www.jasonsome.cn" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Disposition, ETag, Last-Modified, X-Request-Id, X-Library-File-Source, X-Download-Accelerator" always;
      add_header Vary "Origin" always;
      add_header Accept-Ranges bytes always;
      add_header X-Download-Accelerator nginx-sendfile always;
    }

    location / {
      proxy_pass http://library_file_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }
  }
}
