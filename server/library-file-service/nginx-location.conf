# Add this location inside the Dify HTTPS server block.
location /custom-library/ {
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $library_file_upstream dify-library-file-accelerator:3012;
  rewrite ^/custom-library/(.*)$ /$1 break;
  proxy_pass http://$library_file_upstream;
  include proxy.conf;
  add_header Access-Control-Allow-Origin "https://www.jasonsome.cn" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Range, Content-Type" always;
  add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Disposition, ETag, Last-Modified, X-Request-Id, X-Library-File-Source" always;
  add_header Vary "Origin" always;
}
